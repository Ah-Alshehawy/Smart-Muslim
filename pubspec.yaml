name: smart_muslim
description: "Smart Muslim (المسلم الذكي) — Production-Grade, Ad-Free Islamic Mobile Application"
publish_to: 'none'
version: 0.2.0-dev.3.4+9

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Astronomical Prayer Calculation & Sensors
  adhan: ^2.0.0
  geolocator: ^10.1.0
  sensors_plus: ^5.0.0

  # Local Notifications & Audio
  flutter_local_notifications: ^17.0.0
  just_audio: ^0.9.36
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1

  # Local Storage & Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  shared_preferences: ^2.2.2

  # UI Enhancements & SVG Icons
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Firebase & Updates
  firebase_core: ^3.1.0
  firebase_remote_config: ^5.0.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
    - assets/images/
    - assets/quran/
    - assets/quran/mushaf/
    - assets/quran/mushaf/pages/

  generate: true

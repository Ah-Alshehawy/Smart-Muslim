  <!-- Arabic Wordmark (RTL — positioned to the left of icon) -->
  <text x="395" y="55" font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', sans-serif" font-weight="700" font-size="36" fill="#172A2B" text-anchor="end" direction="rtl">المسلم الذكي</text>

  <!-- Subtitle -->
  <text x="395" y="82" font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', sans-serif" font-weight="400" font-size="14" fill="#5F6F70" text-anchor="end" direction="rtl">رفيقك للعبادة والطاعة</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5C5E"/>
      <stop offset="100%" stop-color="#083F41"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B278"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
  </defs>
  
  <!-- Base Rounded Container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#tealGrad)" stroke="#1A4749" stroke-width="1.5"/>
  
  <!-- Outer Subtle Star Contour (Rub el Hizb) -->
  <rect x="25" y="25" width="50" height="50" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="2" transform="rotate(45 50 50)"/>
  <rect x="25" y="25" width="50" height="50" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Inner Serene Motif: Mihrab Arch Curve & Compass Tip -->
  <path d="M 50 28 C 43 36, 40 46, 40 58 L 60 58 C 60 46, 57 36, 50 28 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="50" cy="65" r="3.5" fill="url(#goldGrad)"/>
</svg>
